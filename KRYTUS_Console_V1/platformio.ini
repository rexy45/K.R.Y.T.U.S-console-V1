; KRYTUS Console V1 - PlatformIO project
; Board: Seeed Studio XIAO ESP32-S3
; Display: ST7735 128x160 SPI TFT

[env:xiao_esp32s3]
platform  = espressif32
board     = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200

lib_deps =
    bodmer/TFT_eSPI@^2.5.43

; TFT_eSPI is configured entirely via build_flags here so nobody has to
; hand-edit the library's User_Setup.h. This is the recommended way to
; configure TFT_eSPI under PlatformIO.
build_flags =
    -DUSER_SETUP_LOADED=1
    -DST7735_DRIVER
    -DTFT_WIDTH=128
    -DTFT_HEIGHT=160

    ; Most 1.8" 128x160 ST7735 boards use the "green tab" variant.
    ; If colors look wrong or the image is offset, try one of the
    ; alternatives instead (only ONE of these ST77xx tab defines
    ; should ever be active at a time):
    ;   -DST7735_GREENTAB2
    ;   -DST7735_REDTAB
    ;   -DST7735_BLACKTAB
    -DST7735_GREENTAB

    ; Wiring per KRYTUS V1 spec (XIAO ESP32-S3, NOT SuperMini pinout)
    -DTFT_MISO=-1
    -DTFT_MOSI=9
    -DTFT_SCLK=7
    -DTFT_CS=2
    -DTFT_DC=3
    -DTFT_RST=4
    -DTFT_BL=5
    -DTFT_BACKLIGHT_ON=HIGH

    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=20000000
